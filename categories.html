<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Categories — Mwakete</title>
  <meta name="description" content="Browse everything on Mwakete by category — food, clothing, household, electronics, rentals and services from local Kiribati sellers.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav browse-locked">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Stores</a></li>
        </ul>
      </nav>
    </div>
    <div class="container site-branding">
      <!-- The search box stands where the word "Browse" was. The page still has
           a name for screen readers and the tab title; a one-word banner was
           costing a row of header on a phone to say what the URL already says. -->
      <form id="browse-search-form" class="search-box" role="search">
        <label class="sr-only" for="browse-search-input">Search within this category</label>
        <input id="browse-search-input" type="search" placeholder="Search this category…">
        <button type="submit" class="btn btn-primary search-submit">
          <svg class="search-submit-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
          <span class="search-submit-label">Search</span>
        </button>
      </form>
    </div>
  </header>

  <main id="main">
    <!-- Two panes: the category rail on the left, that category's products on
         the right. The rail is a fixed six entries, so its height is known and
         held in CSS (.category-rail) rather than growing once the script fills
         it in. -->
    <section id="categories" class="category-browser" aria-labelledby="categories-heading">
      <h1 id="categories-heading" class="sr-only">Browse by category</h1>

      <nav class="category-rail" id="category-rail" aria-label="Categories"></nav>

      <div class="category-pane">
        <h2 id="category-pane-heading" class="category-pane-heading">Browse</h2>
        <!-- Deliberately no .is-reserving-space. A viewport-tall reservation
             fits a full-width product grid, but these tiles are three across
             and short, so it overshoots and the release is itself a jump:
             measured, it took this page from CLS 0.014 to 0.133. -->
        <!-- Admin-curated (the Featured sheet, addFeatured is isOwnerAdmin-only),
             filtered to the open category, and labelled. A shopper can always
             tell a placed item from an organic one. -->
        <section id="featured-strip" class="featured-strip" aria-labelledby="featured-strip-heading" hidden>
          <h3 id="featured-strip-heading" class="featured-strip-heading">Featured</h3>
          <div id="featured-list" class="category-grid"></div>
        </section>
        <p id="category-status" class="helper-text" role="status">Loading…</p>
        <!-- Smart-search discovery, moved here with the rest of search.html.
             Empty and hidden unless a site-wide query returned nothing AND
             search-intent.js read a category out of the phrase. -->
        <div id="search-discovery" class="search-discovery" hidden></div>
        <div id="category-list" class="category-grid"></div>
        <p class="load-more-row"><button type="button" id="category-more" class="btn btn-small" hidden>More…</button></p>
      </div>

      <noscript><p class="container">Please enable JavaScript in your browser to browse categories.</p></noscript>
    </section>
  </main>

  <script defer src="assets/js/config.min.js"></script>
  <script defer src="assets/js/api.min.js"></script>
  <script defer src="assets/js/helpers.min.js"></script>
  <script defer src="assets/js/cookie-consent.min.js"></script>
  <!-- Before categories.js: it calls detectSearchIntent(). Pure dictionary, no
       network, no dependency. -->
  <script defer src="assets/js/search-intent.min.js"></script>
  <script defer src="assets/js/categories.min.js"></script>
  <script defer src="assets/js/customer-auth.min.js"></script>
  <script defer src="assets/js/header-cart.min.js"></script>
  <script defer src="assets/js/bottom-nav.min.js"></script>
  <script defer src="assets/js/register-sw.min.js"></script>
</body>
</html>
