<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Browse Stores</a></li>
        </ul>
      </nav>
      <img src="assets/img/favicon.svg" alt="Mwakete" class="header-logo-mark">
    </div>
  </header>

  <main id="main">
    <div class="container">
      <div class="dash-head">
        <h1>My Account</h1>
        <button type="button" id="customer-logout" class="btn btn-small">Log out</button>
      </div>

      <p><a href="customer-messages.html">My Messages →</a></p>
      <p id="seller-link-wrap" class="hidden"><a id="seller-link" href="owner/dashboard.html">Go to seller dashboard →</a></p>

      <section class="dash-section">
        <h2>Profile</h2>
        <div id="profile-view">
          <p><strong id="profile-name"></strong></p>
          <p class="helper-text" id="profile-email"></p>
          <p class="helper-text" id="profile-phone"></p>
          <button type="button" id="profile-edit-btn" class="btn btn-small">Edit</button>
        </div>
        <form id="profile-form" class="hidden" novalidate>
          <div class="field">
            <label for="profile-name-input">Name</label>
            <input id="profile-name-input" type="text" autocomplete="name">
          </div>
          <div class="field">
            <label for="profile-phone-input">Phone Number</label>
            <input id="profile-phone-input" type="tel" autocomplete="tel">
            <p class="helper-text">Local numbers start with 730 or 630. Overseas? Include your country code (e.g. +64…).</p>
          </div>
          <p id="profile-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="profile-cancel" class="btn">Cancel</button>
        </form>
      </section>

      <section class="dash-section">
        <h2>My Orders</h2>
        <p id="orders-status" class="helper-text" aria-live="polite"></p>
        <div id="orders-list"></div>
      </section>

      <section class="dash-section">
        <h2>My Bookings</h2>
        <p id="bookings-status" class="helper-text" aria-live="polite"></p>
        <div id="bookings-list"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="stores.html">Browse All Stores</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/cookie-consent.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/customer-auth.js"></script>
  <script src="assets/js/customer-dashboard.js"></script>
  <script src="assets/js/register-sw.js"></script>
</body>
</html>
