<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div>
        <p class="site-tagline">Search</p>
      </div>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="owner/login.html?tab=register">Create Store</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="container">
        <form id="search-form" class="search-box" role="search">
          <label class="sr-only" for="search-input">Search products</label>
          <input id="search-input" type="search" placeholder="Search products (e.g. rice, t-shirt)">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="category-buttons" id="category-buttons" style="margin-top: 1rem;" aria-label="Shop by category"></div>
      </div>
    </section>

    <section aria-labelledby="results-heading">
      <div class="container">
        <h1 id="results-heading">Results</h1>
        <p id="results-status" class="helper-text" role="status">Loading…</p>
        <div id="results-list" class="product-grid"></div>
        <noscript><p>Please enable JavaScript in your browser to search.</p></noscript>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All payments is arranged between Customer and Seller</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a> · <a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/cookie-consent.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/register-sw.js"></script>
</body>
</html>
