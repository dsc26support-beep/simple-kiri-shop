<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Account — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <a class="header-logo-link" href="index.html" aria-label="Mwakete — home">
        <img src="assets/img/favicon.svg" alt="" class="header-logo-mark">
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Browse Stores</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page-account">
    <div class="container">
      <div class="dash-head">
        <h1>My Account</h1>
        <button type="button" id="customer-logout" class="btn btn-small">Log out</button>
      </div>

      <!-- "Create Store" is the label in the markup on purpose: it is the wider
           of the two, and the box is sized to it, so swapping to "My Store"
           after the lookup changes no width and moves nothing. Rendering the
           common case first also means someone with no store never sees a
           flicker. -->
      <div class="dash-links">
        <a class="btn btn-outline" href="customer-messages.html">My Messages</a>
        <a class="btn btn-outline" id="store-link" href="owner/login.html?tab=register">Create Store</a>
      </div>
      <p id="seller-link-wrap" class="hidden"><a id="seller-link" href="owner/dashboard.html">Go to seller dashboard →</a></p>

      <section class="dash-section">
        <h2>Profile</h2>
        <div id="profile-view">
          <p><strong id="profile-name"></strong></p>
          <p class="helper-text" id="profile-email"></p>
          <p class="helper-text" id="profile-phone"></p>
          <button type="button" id="profile-edit-btn" class="btn btn-small">Edit</button>
        </div>
        <form id="profile-form" class="hidden" novalidate>
          <div class="field">
            <label for="profile-name-input">Name</label>
            <input id="profile-name-input" type="text" autocomplete="name">
          </div>
          <div class="field">
            <label for="profile-phone-input">Phone Number</label>
            <input id="profile-phone-input" type="tel" autocomplete="tel">
            <p class="helper-text">Local numbers start with 730 or 630. Overseas? Include your country code (e.g. +64…).</p>
          </div>
          <p id="profile-error" class="form-error" role="alert"></p>
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" id="profile-cancel" class="btn">Cancel</button>
        </form>
      </section>

      <section class="dash-section">
        <h2>My Orders</h2>
        <!-- Filters are rendered by customer-dashboard.js from the statuses
             actually present, so a status the shop never uses never appears
             as an empty tab. Filtering is done over the already-loaded list -
             no second request. -->
        <div class="dash-filters" id="orders-filters" role="group" aria-label="Filter orders"></div>
        <p id="orders-status" class="helper-text" aria-live="polite"></p>
        <div id="orders-list"></div>
      </section>

      <section class="dash-section">
        <h2>My Bookings</h2>
        <div class="dash-filters" id="bookings-filters" role="group" aria-label="Filter bookings"></div>
        <p id="bookings-status" class="helper-text" aria-live="polite"></p>
        <div id="bookings-list"></div>
      </section>
    </div>
  </main>

  <script defer src="assets/js/config.min.js"></script>
  <script defer src="assets/js/api.min.js"></script>
  <script defer src="assets/js/helpers.min.js"></script>
  <script defer src="assets/js/cookie-consent.min.js"></script>
  <script defer src="assets/js/auth.min.js"></script>
  <script defer src="assets/js/customer-auth.min.js"></script>
  <script defer src="assets/js/customer-dashboard.min.js"></script>
  <script defer src="assets/js/header-cart.min.js"></script>
  <script defer src="assets/js/bottom-nav.min.js"></script>
  <script defer src="assets/js/register-sw.min.js"></script>
</body>
</html>
