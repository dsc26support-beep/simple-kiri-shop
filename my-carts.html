<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Carts — Mwakete</title>
  <meta name="description" content="Every Mwakete store you have an unfinished cart with, in one place.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Stores</a></li>
        </ul>
      </nav>
    </div>
    <div class="container site-branding">
      <p class="site-tagline">Your Carts</p>
    </div>
  </header>

  <main id="main">
    <section id="my-carts" aria-labelledby="my-carts-heading">
      <div class="container">
        <h1 id="my-carts-heading">Your Carts</h1>
        <!-- Each store you shop with keeps its own cart, so this is the one
             place they are all visible. Rows are drawn from localStorage
             immediately (my-carts.js) and only the store's name and logo wait
             on the backend. -->
        <p id="my-carts-status" class="helper-text" role="status">Loading…</p>
        <div id="my-carts-list" class="my-cart-list"></div>
        <noscript><p>Please enable JavaScript in your browser to see your carts.</p></noscript>
      </div>
    </section>
  </main>

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/helpers.js"></script>
  <script defer src="assets/js/cookie-consent.js"></script>
  <script defer src="assets/js/cart.js"></script>
  <script defer src="assets/js/my-carts.js"></script>
  <script defer src="assets/js/customer-auth.js"></script>
  <script defer src="assets/js/header-cart.js"></script>
  <script defer src="assets/js/bottom-nav.js"></script>
  <script defer src="assets/js/register-sw.js"></script>
</body>
</html>
