# Secret scanning in CI (security audit 2026-11, Stage 4 / finding 7).
#
# gitleaks checks every pull request and every push to main - and, on a PR, the
# WHOLE history (fetch-depth 0) - for committed credentials (API keys, tokens,
# private keys). It is the CI backstop to GitHub's native secret scanning +
# push protection, which the owner enables in repo Settings (see
# docs/secure-deployment-checklist.md). The audit confirmed no secret is in the
# tree or history today; this keeps it that way.
#
# gitleaks-action v2 is free for public repositories. If this repo is ever made
# private, it additionally needs a GITLEAKS_LICENSE secret.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'   # weekly full sweep, Monday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
