<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart — Simple Kiri Shop</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div>
        <p class="site-title">Simple Kiri Shop</p>
        <p class="site-tagline" id="store-name-tagline">Your cart</p>
        <p class="store-phone hidden" id="store-phone-line"></p>
        <span id="store-delivery-icons"></span>
      </div>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a id="back-to-store-link" href="index.html">Continue Shopping</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="cart" aria-labelledby="cart-heading">
      <div class="container">
        <h1 id="cart-heading">Your Order</h1>
        <p id="cart-live" aria-live="polite" class="helper-text"></p>

        <div id="cart-empty" class="empty-state hidden">
          <p>Your cart is empty.</p>
          <a class="btn btn-primary" href="stores.html">Browse Stores</a>
        </div>

        <div id="cart-content" class="hidden">
          <div id="cart-items"></div>
          <div class="cart-total-row">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <a id="checkout-btn" class="btn btn-primary btn-block" href="checkout.html" style="margin-top: 1rem;">Proceed to Checkout</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>No online payment is processed on this site — after you order, the store will contact you to arrange payment.</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a></p>
    </div>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/helpers.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/cart-page.js"></script>
</body>
</html>
