  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    /* Runs before the first paint - the only place that can. Whether this
       device has carts is in localStorage, which is readable synchronously,
       and revealing the "pick up where you left off" row any later pushes the
       directory down the page under the reader's thumb. So the row's height is
       reserved here, in the paint it first appears in.

       Only phone widths (one column) get the reservation: that is where the
       shift is felt, and where the row geometry is a simple N-rows sum. The
       card metrics live in .cart-stores in styles.css and are pinned by a test.
       Scan kept in step with cartStoreSlugs() in assets/js/directory.js. */
    (function () {
      try {
        var n = 0;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('skiri_cart_') === 0) {
            try {
              var cart = JSON.parse(localStorage.getItem(k));
              if (Array.isArray(cart) && cart.length) n++;
            } catch (e) { /* skip malformed cart */ }
          }
        }
        if (!n) return;
        var root = document.documentElement;
        root.classList.add('has-cart-stores');
        root.style.setProperty('--cart-store-rows', String(n));
      } catch (e) { /* storage unavailable - no reservation, no row */ }
    })();
  </script>
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->

</head>
