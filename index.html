<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mwakete</title>
  <meta name="description" content="Shop from local Kiribati stores online — order online, the store will contact you to arrange payment.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <a class="header-logo-link" href="index.html" aria-label="Mwakete — home">
        <img src="assets/img/favicon.svg" alt="" class="header-logo-mark">
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <!-- Desktop only. Below 700px the bottom nav carries Tips as one of
               its five tabs, so a header link there would be the same
               destination twice on one screen. Above 700px the bottom nav is
               display:none, and without this the Tips page has no link at all. -->
          <li class="nav-tips"><a href="customer-tips.html">Tips</a></li>
          <li id="nav-create-store"><a href="owner/login.html?tab=register">Create Store</a></li>
          <li id="nav-signin"><a id="nav-signin-link" href="customer-login.html">Sign In</a></li>
        </ul>
      </nav>
    </div>
    <div class="container site-branding">
      <p class="site-title">Mwakete</p>
    </div>
  </header>

  <main id="main" class="home-main page-products">
    <!-- Search first, because that is how someone who knows what they want
         gets there fastest. Everything below is for someone who does not. -->
    <section class="hero">
      <div class="container">
        <form id="search-form" class="search-box" role="search">
          <label class="sr-only" for="search-input">Search products, services and rentals</label>
          <input id="search-input" type="search" placeholder="Search products, services, rentals…">
          <!-- The label stays in the markup at every width: on the phone it is
               clipped rather than removed, so the button's accessible name is
               still "Search" even when only the glass is drawn. -->
          <button type="submit" class="btn btn-primary search-submit">
            <svg class="search-submit-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
            <span class="search-submit-label">Search</span>
          </button>
        </form>
      </div>
    </section>

    <!-- Two strips, two different questions. This one asks what KIND of thing
         you want; the one below asks what it IS. Both are rendered from the
         shared taxonomy in helpers.js and scroll sideways rather than wrapping,
         so neither eats the first screen. Their heights are reserved in CSS so
         filling them in cannot push the products down. -->
    <section class="listing-types" aria-labelledby="listing-types-heading">
      <div class="container">
        <h2 id="listing-types-heading" class="sr-only">Browse by type</h2>
        <nav class="chip-strip" id="listing-type-strip" aria-label="Filter by listing type"></nav>
      </div>
    </section>

    <section class="categories" aria-labelledby="categories-heading">
      <div class="container">
        <h2 id="categories-heading" class="section-title-sm">Popular Categories</h2>
        <nav class="chip-strip" id="category-strip" aria-label="Popular categories"></nav>
      </div>
    </section>

    <section class="trending-products" aria-labelledby="trending-products-heading">
      <div class="container">
        <h2 id="trending-products-heading">Trending Products</h2>
        <p id="trending-products-status" class="helper-text is-reserving-space" role="status">Loading…</p>
        <div id="trending-products-list" class="product-grid"></div>
      </div>
    </section>

    <section class="trending-stores" aria-labelledby="trending-stores-heading">
      <div class="container">
        <h2 id="trending-stores-heading">Popular Stores</h2>
        <p id="trending-stores-status" class="helper-text" role="status">Loading…</p>
        <div id="trending-stores-list" class="logo-carousel"></div>
      </div>
    </section>

    <noscript><div class="container"><p>Please enable JavaScript in your browser to search and shop.</p></div></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All payments is arranged between Customer and Seller</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a> · <a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/helpers.js"></script>
  <script defer src="assets/js/cookie-consent.js"></script>
  <script defer src="assets/js/auth.js"></script>
  <script defer src="assets/js/customer-auth.js"></script>
  <script defer src="assets/js/home-nav.js"></script>
  <script defer src="assets/js/home.js"></script>
  <script defer src="assets/js/header-cart.js"></script>
  <script defer src="assets/js/bottom-nav.js"></script>
  <script defer src="assets/js/register-sw.js"></script>
</body>
</html>
