<head>

  <link rel="stylesheet" href="assets/css/styles.css">

       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->

  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div>
        <p class="site-tagline">All Stores</p>
      </div>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="owner/login.html?tab=register">Create Store</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="stores" aria-labelledby="stores-heading">
      <div class="container">
        <h1 id="stores-heading" class="sr-only">All Stores</h1>
        <form id="stores-search-form" class="search-box" role="search">
          <label class="sr-only" for="stores-search-input">Search all stores</label>
          <input id="stores-search-input" type="search" placeholder="Search All Stores (e.g. Betio or Beru)">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <p id="stores-status" class="helper-text is-reserving-space" role="status">Loading stores…</p>
        <div id="store-list" class="store-grid"></div>
        <p class="load-more-row"><button type="button" id="stores-load-more" class="btn btn-small hidden">Load More Stores</button></p>
        <noscript><p>Please enable JavaScript in your browser to browse stores.</p></noscript>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All payments is arranged between Customer and Seller</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a> · <a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>
