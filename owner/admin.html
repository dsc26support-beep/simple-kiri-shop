<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Tips — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/owner.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon-180.png">
</head>
<body class="owner-shell">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="owner-topbar">
    <div class="container">
      <strong>Admin — Tips</strong>
      <nav class="owner-nav" aria-label="Store owner">
        <ul>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="../index.html">Home</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <main id="main" class="owner-main">
    <div class="container">
      <h1>Featured Tips</h1>
      <p id="admin-denied" class="hidden">You don't have admin access.</p>

      <div id="admin-tools" class="hidden">
        <section class="dash-section">
          <h2>Feature a store</h2>
          <div class="field">
            <label for="store-select">Store</label>
            <select id="store-select"><option value="">Choose a store…</option></select>
          </div>
          <button type="button" id="feature-store-btn" class="btn btn-primary">Feature store</button>
        </section>

        <section class="dash-section">
          <h2>Feature a product</h2>
          <div class="field">
            <label for="prod-store-select">Store</label>
            <select id="prod-store-select"><option value="">Choose a store…</option></select>
          </div>
          <div class="field">
            <label for="product-select">Product</label>
            <select id="product-select"><option value="">Choose a store first…</option></select>
          </div>
          <button type="button" id="feature-product-btn" class="btn btn-primary">Feature product</button>
        </section>

        <p id="admin-error" class="form-error" role="alert"></p>

        <section class="dash-section">
          <h2>Currently featured</h2>
          <p id="featured-status" class="helper-text" aria-live="polite"></p>
          <div id="featured-list"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/helpers.js"></script>
  <script src="../assets/js/cookie-consent.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script src="../assets/js/register-sw.js"></script>
</body>
</html>
