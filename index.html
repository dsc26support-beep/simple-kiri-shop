<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mwakete</title>
  <meta name="description" content="Shop from local Kiribati stores online — order online, the store will contact you to arrange payment.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav has-header-menu">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <a class="header-logo-link" href="index.html" aria-label="Mwakete — home">
        <img src="assets/img/favicon.svg" alt="" class="header-logo-mark">
      </a>
    </div>
    <div class="container site-branding">
      <p class="site-title">Mwakete</p>
    </div>
  </header>

  <main id="main" class="home-main page-products">
    <!-- Search first, because that is how someone who knows what they want
         gets there fastest. Everything below is for someone who does not. -->
    <section class="hero">
      <div class="container">
        <!-- No submit button on this one. The magnifying glass is gone and the
             search runs on Enter, or the "Go" key every mobile keyboard puts
             there for an <input type="search"> inside a <form>. The other three
             search boxes keep theirs. -->
        <form id="search-form" class="search-box search-box--voice" role="search">
          <label class="sr-only" for="search-input">Search products, services and rentals</label>
          <input id="search-input" type="search" placeholder="What is on your mind?">
          <!-- Hidden until the script confirms the browser can actually listen -
             see startVoiceSearch in home.js. Drawn hidden rather than added
             later so it can never appear after first paint and move the bar. -->
          <button type="button" id="voice-search-btn" class="search-voice-btn" hidden
                  aria-label="Search by voice — speak in English">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
          </button>
          <!-- Announced, not just drawn: someone who cannot see the button turn
               red still has to know the microphone is live. -->
          <p id="voice-search-status" class="sr-only" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <!-- Rendered from the shared taxonomy in helpers.js, scrolling sideways
         rather than wrapping so it never eats the first screen. Its height is
         reserved in CSS, so filling it in cannot push the products down.

         There used to be a second strip above this one asking what KIND of
         thing you wanted - All / Products / Rentals / Services. It is gone.
         ?type= still filters, and smart search still builds those links, so
         "somewhere to stay" reaches rentals rather than land for sale; there is
         simply no visible control for it now. -->

    <section class="categories" aria-labelledby="categories-heading">
      <div class="container">
        <h2 id="categories-heading" class="section-title-sm">Popular Categories</h2>
        <nav class="chip-strip" id="category-strip" aria-label="Popular categories"></nav>
      </div>
    </section>

    <section class="trending-products" aria-labelledby="trending-products-heading">
      <div class="container">
        <h2 id="trending-products-heading">Trending Products</h2>
        <p id="trending-products-status" class="helper-text is-reserving-space" role="status">Loading…</p>
        <div id="trending-products-list" class="product-grid"></div>
        <!-- Filled by mountBadgeLegend (badges.js) only when a card on this
             page actually carries a badge - a panel explaining eight badges
             none of which appear would be clutter. -->
        <div id="home-badge-legend"></div>
      </div>
    </section>

    <section class="trending-stores" aria-labelledby="trending-stores-heading">
      <div class="container">
        <h2 id="trending-stores-heading">Popular Stores</h2>
        <p id="trending-stores-status" class="helper-text" role="status">Loading…</p>
        <div id="trending-stores-list" class="logo-carousel"></div>
      </div>
    </section>

    <noscript><div class="container"><p>Please enable JavaScript in your browser to search and shop.</p></div></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="copyright">©MainKT Enterprises <a href="terms.html">Terms</a> <span aria-hidden="true">|</span> <a href="privacy.html">Privacy</a></p>
    </div>
  </footer>

  <script defer src="assets/js/config.min.js"></script>
  <script defer src="assets/js/api.min.js"></script>
  <script defer src="assets/js/helpers.min.js"></script>
  <script defer src="assets/js/badges.min.js"></script>
  <script defer src="assets/js/cookie-consent.min.js"></script>
  <script defer src="assets/js/auth.min.js"></script>
  <script defer src="assets/js/customer-auth.min.js"></script>
  <script defer src="assets/js/home.min.js"></script>
  <script defer src="assets/js/header-cart.min.js"></script>
  <script defer src="assets/js/header-menu.min.js"></script>
  <script defer src="assets/js/bottom-nav.min.js"></script>
  <script defer src="assets/js/register-sw.min.js"></script>
</body>
</html>
