<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store — Mwakete</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body class="has-bottom-nav has-header-menu page-store">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <!-- Store logo top-left, level with Home (owner request, Oct 2026). -->
      <img id="store-logo-img" class="store-logo hidden" alt="">
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
        </ul>
      </nav>
    </div>
    <div class="container store-branding">
      <div class="store-branding-info">
        <p class="site-tagline" id="store-name-tagline"><span class="loading-msg">Loading<span class="loading-dots"><span></span><span></span><span></span></span></span></p>
        <p class="store-phone hidden" id="store-phone-line"></p>
        <span id="store-delivery-icons"></span>
        <p id="store-payment-line" class="store-payment-line" hidden></p>
      </div>
    </div>
  </header>

  <a id="cart-link" class="floating-action-btn floating-action-btn--left floating-action-btn--cart" href="cart.html" aria-label="View cart">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    <span>Cart (<span id="cart-count">0</span>)</span>
  </a>

  <button type="button" id="chat-fab" class="floating-action-btn floating-action-btn--right chat-fab-btn" aria-label="Chat with this store">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    <span id="chat-unread-badge" class="chat-unread-badge hidden">0</span>
  </button>

  <div id="chat-window" class="chat-window" role="dialog" aria-labelledby="chat-window-vendor-name">
    <div class="chat-window-header">
      <div id="chat-vendor-avatar-placeholder" class="chat-vendor-avatar-placeholder" aria-hidden="true">S</div>
      <div class="chat-vendor-info">
        <p id="chat-window-vendor-name" class="chat-vendor-name">This Store</p>
        <p class="chat-vendor-status"><span class="chat-status-dot" aria-hidden="true"></span>Online</p>
      </div>
      <button type="button" id="chat-video-call-btn" class="chat-video-call-btn" aria-label="Meetings" title="Meetings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      </button>
      <button type="button" id="chat-window-close" class="chat-window-close" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
      </button>
    </div>

    <div id="chat-window-body" class="chat-window-body">
      <div id="chat-name-gate" class="chat-name-gate hidden">
        <p class="chat-name-gate-prompt">What's your name?</p>
        <form id="chat-name-form" class="chat-name-form">
          <label class="sr-only" for="chat-name-input">Your name</label>
          <input id="chat-name-input" class="chat-name-input" type="text" placeholder="Your name" maxlength="100" required autocomplete="name">
          <button type="submit" class="btn btn-primary">Continue</button>
        </form>
      </div>

      <div id="chat-loading" class="chat-loading hidden">
        <span class="chat-spinner" aria-hidden="true"></span>
        <span><span class="loading-msg">Loading<span class="loading-dots"><span></span><span></span><span></span></span></span></span>
      </div>

      <div id="meeting-panel-host" class="meeting-panel hidden"></div>

      <div id="chat-messages" class="chat-messages hidden">
        <button type="button" id="chat-load-earlier-btn" class="chat-load-earlier-btn btn btn-small hidden">Load earlier messages</button>
        <div id="chat-typing" class="chat-typing hidden" aria-live="polite">
          <span class="chat-typing-dot"></span>
          <span class="chat-typing-dot"></span>
          <span class="chat-typing-dot"></span>
        </div>
      </div>
    </div>

    <div id="chat-image-preview" class="chat-image-preview hidden">
      <img id="chat-image-preview-img" alt="Selected photo preview">
      <button type="button" id="chat-image-preview-remove" class="chat-image-preview-remove" aria-label="Remove selected photo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="M6 6l12 12"></path></svg>
      </button>
    </div>

    <form id="chat-window-form" class="chat-window-input-row">
      <button type="button" id="chat-attach-btn" class="chat-attach-btn" aria-label="Attach a photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
      </button>
      <input type="file" id="chat-image-input" accept="image/*" class="hidden" aria-hidden="true">
      <textarea id="chat-message-input" class="chat-message-input" placeholder="Type a message…" rows="1" aria-label="Type a message"></textarea>
      <button type="submit" id="chat-send-btn" class="chat-send-btn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path></svg>
      </button>
    </form>
  </div>

  <main id="main" class="page-products">
    <!-- Phones and tablets: the store as a profile (owner request, Nov 2026) -
         cover photo, round logo over its edge, name and status, the seller's
         own words with "More info", then Products | Photos tabs. No red header
         and no message button there (owner, 1 Nov 2026): the ⋮ menu is on the
         cover and the round chat button stays. Hidden on a computer by CSS, which keeps the
         header layout above. Heights are fixed in CSS so filling it in after
         the fetch does not push the products down. store.js fills it. -->
    <section id="store-profile" class="store-profile" aria-label="About this store">
      <div class="sp-cover" id="sp-cover">
        <img id="sp-cover-img" class="sp-cover-img" alt="" hidden>
        <!-- Tablets: Home and the cart sit on the cover (the red header is
             gone there, and phones have them in the bottom bar). store.js
             also moves the ⋮ menu here. -->
        <a class="sp-cover-icon sp-home" href="index.html" aria-label="Home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
        </a>
        <!-- The store's own seller only (store.js checks the sign-in): change
             the banner from here. Customers never see it. -->
        <label class="sp-cam sp-cam-cover" id="sp-cam-cover" hidden>
          <input type="file" id="sp-cover-input" accept="image/jpeg,image/png,image/webp" class="sr-only">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span>Change banner</span>
        </label>
        <div class="sp-cover-bar">
          <a class="sp-back" href="stores.html" id="sp-back" aria-label="Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
          </a>
          <div class="sp-cover-text">
            <p class="sp-cover-name"><span id="sp-cover-name"></span><span id="sp-verified" class="sp-verified" hidden></span></p>
          </div>
        </div>
      </div>
      <div class="sp-head">
        <div class="sp-avatar" id="sp-avatar"><img id="sp-avatar-img" alt="" hidden><span id="sp-avatar-initials" aria-hidden="true"></span><span class="sp-dot" id="sp-dot" hidden></span>
          <label class="sp-cam sp-cam-logo" id="sp-cam-logo" hidden aria-label="Change logo">
            <input type="file" id="sp-logo-input" accept="image/jpeg,image/png,image/webp" class="sr-only">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          </label></div>
        <!-- Products, Photos, Info and Share as round buttons beside the logo
             (owner, 2 Nov 2026) - they replace the tab bar and the "More info"
             link. Products / Photos switch the view below (aria-pressed shows
             which); Info opens the details panel from the bottom. -->
        <div class="sp-actions" role="group" aria-label="Store">
          <button type="button" class="sp-act" id="sp-tab-products" aria-pressed="true" aria-controls="product-list">
            <span class="sp-act-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7 12 3 4 7v10l8 4 8-4z"></path><path d="m4 7 8 4 8-4M12 11v10"></path></svg></span>
            <span class="sp-act-label" id="sp-count-products">Products</span>
          </button>
          <button type="button" class="sp-act" id="sp-tab-photos" aria-pressed="false" aria-controls="store-photos">
            <span class="sp-act-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m21 16-5-5-8 9"></path></svg></span>
            <span class="sp-act-label" id="sp-count-photos">Photos</span>
          </button>
          <button type="button" class="sp-act" id="sp-more" aria-haspopup="dialog" aria-controls="sp-sheet">
            <span class="sp-act-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6"></path><path d="M12 7.5v.01"></path></svg></span>
            <span class="sp-act-label">Info</span>
          </button>
          <button type="button" class="sp-act" id="sp-share" aria-label="Share this store">
            <span class="sp-act-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4 11 13"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></span>
            <span class="sp-act-label" aria-hidden="true">Share</span>
          </button>
        </div>
      </div>
      <div class="sp-body">
        <!-- No name / place / "Open now" lines here (owner, 1 Nov 2026): the
             name is on the cover and the dot on the logo says open or closed.
             A closed store still says so in words. -->
        <h2 class="sr-only" id="sp-name"></h2>
        <p class="sp-meta" id="sp-meta" hidden></p>
        <p class="sp-upload-status" id="sp-upload-status" role="status" aria-live="polite"></p>
        <p class="sp-bio" id="sp-bio" hidden></p>
      </div>
      <!-- More info: slides up from the bottom; tap outside or ✕ to close. -->
      <dialog class="sp-sheet" id="sp-sheet" aria-labelledby="sp-sheet-title">
        <div class="sp-sheet-head"><h2 id="sp-sheet-title">About this store</h2><button type="button" class="sp-sheet-close" id="sp-sheet-close" aria-label="Close">×</button></div>
        <div class="sp-info" id="sp-info">
          <p class="sp-bio-full" id="sp-bio-full" hidden></p>
          <p id="sp-place"></p>
          <p id="sp-phone" hidden></p>
          <div id="sp-delivery"></div>
          <p id="sp-payment" hidden></p>
          <div id="sp-badges"></div>
        </div>
      </dialog>
    </section>

    <section aria-labelledby="products-heading">
      <div class="container">
        <h1 id="products-heading" class="sr-only">Products</h1>
        <form id="products-search-form" class="search-box" role="search">
          <label class="sr-only" for="products-search-input">Search products</label>
          <input id="products-search-input" type="search" placeholder="Search Products (e.g. rice, t-shirt)">
          <!-- The label stays in the markup at every width: on the phone it is
               clipped rather than removed, so the button's accessible name is
               still "Search" even when only the glass is drawn. -->
          <button type="submit" class="btn btn-primary search-submit">
            <svg class="search-submit-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.6-3.6"></path></svg>
            <span class="search-submit-label">Search</span>
          </button>
        </form>
        <p id="products-status" class="helper-text is-reserving-space" role="status"><span class="loading-msg">Loading<span class="loading-dots"><span></span><span></span><span></span></span></span></p>
        <!-- Directly above the grid, and NOT above the search box where it
             started: filled after the fetch, it pushed the search box, the
             status line and the whole grid down - 0.01 CLS on a phone against
             a baseline of 0.0001. Here the only thing below it is the grid,
             which is filled in the same task and was empty until then.

             Not in the header branding block either. That sits above <main>,
             so anything added to it after the fetch moves the entire page -
             which is where this page's sibling once measured 0.853. -->
        <div id="store-seller-badges" class="store-seller-badges"></div>
        <div id="product-list" class="product-grid"></div>
        <!-- The Photos tab (phones and tablets): every product picture, three
             across; a tap opens that product. -->
        <div id="store-photos" class="sp-photos" hidden></div>
        <!-- Filled by mountBadgeLegend (badges.js) only when a card on this
             page actually carries a badge - a panel explaining eight badges
             none of which appear would be clutter. -->
        <div id="store-badge-legend"></div>
        <p id="cart-feedback" class="form-success" aria-live="polite"></p>
        <noscript><p>Please enable JavaScript to shop with us.</p></noscript>
      </div>
    </section>

    <section id="similar-section" class="hidden" aria-labelledby="similar-heading">
      <div class="container">
        <h2 id="similar-heading">Similar Products</h2>
        <div id="similar-products-list" class="similar-products-grid"></div>
      </div>
    </section>
  </main>

  <script defer src="assets/js/config.min.js"></script>
  <script defer src="assets/js/api.min.js"></script>
  <script defer src="assets/js/helpers.min.js"></script>
  <script defer src="assets/js/badges.min.js"></script>
  <script defer src="assets/js/cookie-consent.min.js"></script>
  <script defer src="assets/js/chat-window.min.js"></script>
  <script defer src="assets/js/fab-drag.min.js"></script>
  <script defer src="assets/js/cart.min.js"></script>
  <script defer src="assets/js/card-cart.min.js"></script>
  <script defer src="assets/js/product-card.min.js"></script>
  <script defer src="assets/js/recent-views.min.js"></script>
  <script defer src="assets/js/store-cover.min.js"></script>
  <script defer src="assets/js/store.min.js"></script>
  <script defer src="assets/js/customer-auth.min.js"></script>
  <script defer src="assets/js/header-cart.min.js"></script>
  <script defer src="assets/js/header-menu.min.js"></script>
  <script defer src="assets/js/bottom-nav.min.js"></script>

</body>
