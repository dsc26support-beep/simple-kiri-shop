<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Categories — Mwakete</title>
  <meta name="description" content="Browse everything on Mwakete by category — food, clothing, household, electronics, rentals and services from local Kiribati sellers.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Stores</a></li>
        </ul>
      </nav>
    </div>
    <div class="container site-branding">
      <p class="site-tagline">Browse</p>
    </div>
  </header>

  <main id="main">
    <!-- Two panes: the category rail on the left, that category's products on
         the right. The rail is a fixed six entries, so its height is known and
         held in CSS (.category-rail) rather than growing once the script fills
         it in. -->
    <section id="categories" class="category-browser" aria-labelledby="categories-heading">
      <h1 id="categories-heading" class="sr-only">Browse by category</h1>

      <nav class="category-rail" id="category-rail" aria-label="Categories"></nav>

      <div class="category-pane">
        <h2 id="category-pane-heading" class="category-pane-heading">Browse</h2>
        <!-- Deliberately no .is-reserving-space. A viewport-tall reservation
             fits a full-width product grid, but these tiles are three across
             and short, so it overshoots and the release is itself a jump:
             measured, it took this page from CLS 0.014 to 0.133. -->
        <p id="category-status" class="helper-text" role="status">Loading…</p>
        <div id="category-list" class="category-grid"></div>
        <p class="load-more-row"><button type="button" id="category-more" class="btn btn-small" hidden>Show More</button></p>
      </div>

      <noscript><p class="container">Please enable JavaScript in your browser to browse categories.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All payments is arranged between Customer and Seller</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a> · <a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/helpers.js"></script>
  <script defer src="assets/js/cookie-consent.js"></script>
  <script defer src="assets/js/categories.js"></script>
  <script defer src="assets/js/customer-auth.js"></script>
  <script defer src="assets/js/header-cart.js"></script>
  <script defer src="assets/js/bottom-nav.js"></script>
  <script defer src="assets/js/register-sw.js"></script>
</body>
</html>
