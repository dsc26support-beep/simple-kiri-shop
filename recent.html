<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recents — Mwakete</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.min.css">
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav has-header-menu">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-top-row">
      <a class="header-logo-link" href="index.html" aria-label="Mwakete — home">
        <img src="assets/img/favicon.svg" alt="" class="header-logo-mark"><span class="header-wordmark" aria-hidden="true">wakete</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="stores.html">Browse Stores</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page-products recent-page">
    <div class="container">
      <h1>Recents</h1>
      <p class="helper-text">Products and stores you opened on this device. Only you can see this - it is never sent to Mwakete.</p>

      <div class="recent-tabs" role="tablist" aria-label="Recents">
        <button type="button" role="tab" id="recent-tab-products" class="recent-tab" aria-selected="true" aria-controls="recent-panel-products">Products <span class="recent-count" id="recent-count-products"></span></button>
        <button type="button" role="tab" id="recent-tab-stores" class="recent-tab" aria-selected="false" aria-controls="recent-panel-stores" tabindex="-1">Stores <span class="recent-count" id="recent-count-stores"></span></button>
      </div>

      <section id="recent-panel-products" class="recent-panel" role="tabpanel" aria-labelledby="recent-tab-products" tabindex="0">
        <ul class="recent-list" id="recent-products"></ul>
      </section>
      <section id="recent-panel-stores" class="recent-panel" role="tabpanel" aria-labelledby="recent-tab-stores" tabindex="0" hidden>
        <ul class="recent-list" id="recent-stores"></ul>
      </section>

      <p class="recent-clear-row"><button type="button" id="recent-clear" class="btn btn-small" hidden>Clear history</button></p>
      <p id="recent-status" class="sr-only" role="status" aria-live="polite"></p>
    </div>
  </main>

  <noscript><div class="container"><p>Please enable JavaScript to see your recent views.</p></div></noscript>

  <script defer src="assets/js/config.min.js"></script>
  <script defer src="assets/js/api.min.js"></script>
  <script defer src="assets/js/helpers.min.js"></script>
  <script defer src="assets/js/cookie-consent.min.js"></script>
  <script defer src="assets/js/recent-views.min.js"></script>
  <script defer src="assets/js/recent.min.js"></script>
  <script defer src="assets/js/customer-auth.min.js"></script>
  <script defer src="assets/js/header-cart.min.js"></script>
  <script defer src="assets/js/header-menu.min.js"></script>
  <script defer src="assets/js/bottom-nav.min.js"></script>
  <script defer src="assets/js/register-sw.min.js"></script>
</body>
</html>
