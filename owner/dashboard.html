<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/owner.css">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon-180.png">
</head>
<body class="owner-shell">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="owner-topbar">
    <div class="container">
      <strong id="store-name-label">Dashboard</strong>
      <nav class="owner-nav" aria-label="Store owner">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="dashboard.html">Dashboard</a></li>
          <li><a href="settings.html">Settings</a></li>
          <li><a href="#" id="logout-link">Log Out</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <main id="main" class="owner-main">
    <div class="container">
      <h1>Welcome<span id="welcome-name"></span></h1>
      <p><a id="storefront-link" href="#" target="_blank" rel="noopener">View my public storefront →</a></p>
      <p id="admin-link-wrap" class="hidden"><a href="admin.html">Admin — Tips →</a></p>

      <div class="store-status-toggle-row">
        <span class="store-status-word" id="store-status-open-label">OPEN</span>
        <button type="button" id="store-status-toggle" class="store-status-toggle" role="switch" aria-checked="true" aria-label="Store open or closed to customers">
          <span class="store-status-toggle-knob" aria-hidden="true"></span>
        </button>
        <span class="store-status-word" id="store-status-closed-label">CLOSED</span>
        <span class="helper-text" id="store-status-toggle-hint"></span>
      </div>

      <div class="dashboard-cards">
        <div class="dashboard-card">
          <span class="metric" id="metric-products">–</span>
          <span>Active Products</span>
        </div>
        <div class="dashboard-card">
          <span class="metric" id="metric-orders">–</span>
          <span>Total Orders</span>
        </div>
        <div class="dashboard-card">
          <span class="metric" id="metric-pending">–</span>
          <span>Pending Payment</span>
        </div>
      </div>

      <div class="dashboard-quick-links">
        <button type="button" class="btn btn-light-blue" data-href="products.html" data-label="Products">Products</button>
        <button type="button" class="btn btn-light-blue" data-href="orders.html" data-label="Orders">Orders <span id="nav-orders-badge" class="nav-unread-badge hidden" aria-label="orders needing attention">0</span></button>
        <button type="button" class="btn btn-light-blue" data-href="bookings.html" data-label="Bookings">Bookings <span id="nav-bookings-badge" class="nav-unread-badge hidden" aria-label="bookings needing attention">0</span></button>
        <button type="button" class="btn btn-light-blue" data-href="messages.html" data-label="Messages">Messages <span id="nav-messages-badge" class="nav-unread-badge hidden" aria-label="unread messages">0</span></button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Mwakete — Store Owner Portal</p>
      <p><a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/helpers.js"></script>
  <script src="../assets/js/cookie-consent.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/owner-nav.js"></script>
  <script src="../assets/js/owner-dashboard.js"></script>
  <script src="../assets/js/register-sw.js"></script>
</body>
</html>
