<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search — Mwakete</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/styles.css">
  <!-- The Apps Script backend gates whether the page has any content at all.
       /exec answers with a 302 to script.googleusercontent.com, so both origins
       need warming or the first data request pays two cold handshakes. -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#332d63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mwakete">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon-180.png">
</head>
<body class="has-bottom-nav">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div>
        <p class="site-tagline">Search</p>
      </div>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="owner/login.html?tab=register">Create Store</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="page-products">
    <section class="hero">
      <div class="container">
        <form id="search-form" class="search-box" role="search">
          <label class="sr-only" for="search-input">Search products</label>
          <input id="search-input" type="search" placeholder="Search products (e.g. rice, t-shirt)">
          <button type="submit" class="btn btn-primary">Search</button>
        </form>
        <div class="category-buttons" id="category-buttons" style="margin-top: 1rem;" aria-label="Shop by category"></div>
      </div>
    </section>

    <section aria-labelledby="results-heading">
      <div class="container">
        <h1 id="results-heading">Results</h1>

        <div class="results-toolbar" id="results-toolbar" hidden>
          <button type="button" class="btn btn-small" id="filters-toggle" aria-expanded="false" aria-controls="filters-panel">
            Filters
            <span class="filters-count" id="filters-count" hidden></span>
          </button>
          <div class="field results-sort-field">
            <label class="sr-only" for="results-sort">Sort results</label>
            <select id="results-sort">
              <option value="relevance">Relevance</option>
              <option value="cheapest">Price: low to high</option>
              <option value="dearest">Price: high to low</option>
              <option value="popular">Most popular</option>
              <option value="rated">Highest rated</option>
              <option value="newest">Newest</option>
              <option value="name">Name A–Z</option>
            </select>
          </div>
        </div>

        <div class="filters-panel" id="filters-panel" hidden>
          <div class="filters-row" id="filter-price-row">
            <span class="filters-label" id="price-range-label">Price</span>
            <div class="price-range" role="group" aria-labelledby="price-range-label">
              <label class="sr-only" for="filter-price-max">Maximum price</label>
              <input type="range" id="filter-price-max" min="0" max="100" step="1" value="100">
              <output id="filter-price-out" for="filter-price-max"></output>
            </div>
          </div>
          <div class="filters-row" id="filter-delivery-row">
            <span class="filters-label" id="delivery-filter-label">Delivery available</span>
            <div class="filters-chips" id="filter-delivery" role="group" aria-labelledby="delivery-filter-label"></div>
          </div>
          <div class="filters-row" id="filter-store-row">
            <span class="filters-label" for="filter-store">Seller</span>
            <div class="field">
              <label class="sr-only" for="filter-store">Seller</label>
              <select id="filter-store"><option value="">All sellers</option></select>
            </div>
          </div>
          <div class="filters-row" id="filter-available-row">
            <label class="checkbox-line"><input type="checkbox" id="filter-available"> Available only</label>
          </div>
          <div class="filters-actions">
            <button type="button" class="btn btn-small" id="filters-clear">Clear all</button>
            <button type="button" class="btn btn-primary btn-small" id="filters-done">Show results</button>
          </div>
        </div>

        <p id="results-status" class="helper-text is-reserving-space" role="status">Loading…</p>
        <div id="results-list" class="product-grid"></div>
        <div class="results-more" id="results-more" hidden>
          <button type="button" class="btn" id="load-more-btn">Load More</button>
        </div>
        <noscript><p>Please enable JavaScript in your browser to search.</p></noscript>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>All payments is arranged between Customer and Seller</p>
      <p><a href="stores.html">Browse All Stores</a> · <a href="owner/login.html">Vendor Login</a> · <a href="mailto:admin@mwakete.com?subject=Mwakete%20Enquiry">Enquiry</a></p>
      <p class="copyright">©MainKT Enterprises</p>
    </div>
  </footer>

  <script defer src="assets/js/config.js"></script>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/helpers.js"></script>
  <script defer src="assets/js/cookie-consent.js"></script>
  <script defer src="assets/js/search.js"></script>
  <script defer src="assets/js/customer-auth.js"></script>
  <script defer src="assets/js/bottom-nav.js"></script>
  <script defer src="assets/js/register-sw.js"></script>
</body>
</html>
