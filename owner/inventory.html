<body class="owner-shell owner-inventory-page">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="owner-topbar">
    <div class="container">
      <strong id="store-name-label">Inventory</strong>
      <nav class="owner-nav" aria-label="Store owner">
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="#" id="logout-link">Log Out</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <main id="main" class="owner-main">
    <div class="container">
      <h1>Inventory</h1>
      <p class="helper-text">Stock, held by orders, and history. Shoppers buy what's <strong>available</strong> (in stock minus held). <a href="inventory-help.html">Help</a></p>
      <p id="inv-status" class="helper-text" role="status"></p>

      <div id="inv-summary" class="inv-summary hidden" aria-label="Stock summary"></div>
      <nav id="inv-more" class="inv-more hidden" aria-label="More inventory tools"></nav>

      <!-- Wholesaler / distributor tools, opened from the buttons above. -->
      <section id="inv-tool-locations" class="dash-section inv-tool hidden" aria-labelledby="inv-locations-heading">
        <h2 id="inv-locations-heading">Locations</h2>
        <p class="helper-text">Your shops and warehouses. Shoppers buy from the total.</p>
        <div id="inv-locations"></div>
        <form id="inv-location-form" class="inv-inline-form" novalidate>
          <div class="field"><label for="inv-loc-name">New location</label><input id="inv-loc-name" type="text" maxlength="60" placeholder="e.g. Bairiki warehouse"></div>
          <div class="field"><label for="inv-loc-type">Type</label>
            <select id="inv-loc-type"><option value="warehouse">Warehouse</option><option value="store">Shop</option><option value="branch">Branch</option></select></div>
          <button type="submit" class="btn btn-primary">Add location</button>
        </form>
        <p id="inv-locations-error" class="form-error" role="alert"></p>
      </section>

      <section id="inv-tool-suppliers" class="dash-section inv-tool hidden" aria-labelledby="inv-suppliers-heading">
        <h2 id="inv-suppliers-heading">Suppliers</h2>
        <div id="inv-suppliers"></div>
        <form id="inv-supplier-form" class="inv-inline-form" novalidate>
          <input type="hidden" id="inv-sup-id">
          <div class="field"><label for="inv-sup-name">Supplier name</label><input id="inv-sup-name" type="text" maxlength="100"></div>
          <div class="field"><label for="inv-sup-phone">Phone</label><input id="inv-sup-phone" type="tel" maxlength="40"></div>
          <div class="field"><label for="inv-sup-email">Email</label><input id="inv-sup-email" type="email" maxlength="120"></div>
          <button type="submit" class="btn btn-primary" id="inv-sup-save">Add supplier</button>
        </form>
        <p id="inv-suppliers-error" class="form-error" role="alert"></p>
      </section>

      <section id="inv-tool-reports" class="dash-section inv-tool hidden" aria-labelledby="inv-reports-heading">
        <h2 id="inv-reports-heading">Reports</h2>
        <div class="field inv-report-days"><label for="inv-report-days">Period</label>
          <select id="inv-report-days"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option></select></div>
        <div id="inv-report"></div>
      </section>

      <section class="dash-section" aria-labelledby="inv-list-heading">
        <h2 id="inv-list-heading">Stock</h2>
        <div class="inv-filters">
          <label class="sr-only" for="inv-search">Search stock</label>
          <input type="search" id="inv-search" placeholder="Search name, SKU or barcode" autocomplete="off">
          <div class="inv-filter-chips" role="group" aria-label="Show">
            <button type="button" class="inv-chip is-active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="inv-chip" data-filter="low" aria-pressed="false">Low</button>
            <button type="button" class="inv-chip" data-filter="out" aria-pressed="false">Out</button>
            <button type="button" class="inv-chip" data-filter="untracked" aria-pressed="false">Not tracked</button>
          </div>
        </div>
        <div id="inv-list" class="inv-list"></div>
      </section>

      <!-- One action panel, opened under the chosen row's details. -->
      <section id="inv-panel" class="dash-section inv-panel hidden" aria-live="polite" aria-labelledby="inv-panel-title">
        <h2 id="inv-panel-title"></h2>
        <p id="inv-panel-sub" class="helper-text"></p>
        <form id="inv-form" novalidate></form>
        <p id="inv-panel-error" class="form-error" role="alert"></p>
        <p id="inv-panel-saved" class="inv-saved hidden" role="status"></p>
      </section>

      <section class="dash-section" aria-labelledby="inv-history-heading">
        <h2 id="inv-history-heading">Stock history</h2>
        <p id="inv-history-filter" class="helper-text hidden"></p>
        <div id="inv-history"></div>
        <p class="load-more-row"><button type="button" id="inv-history-more" class="btn btn-small hidden">Show older</button></p>
      </section>
    </div>
  </main>
